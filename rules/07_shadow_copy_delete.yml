title: Shadow copy deletion through vssadmin
id: 168f427a-bb72-5ebd-817e-936edd1a77b0
status: experimental
description: vssadmin command includes deletion of shadow copies. Arguments are recorded
  text; no command is executed by this lab.
author: Selbinyyaz Odekova
date: '2026-10-19'
references:
- https://attack.mitre.org/techniques/T1490/
tags:
- attack.impact
- attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \vssadmin.exe
    CommandLine|contains|all:
    - delete
    - shadows
  condition: selection
falsepositives:
- Approved backup cleanup. Confirm maintenance ticket, caller identity and recovery
  policy; never suppress by tool name alone.
level: high
